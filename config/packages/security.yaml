security:
    # Hash delle password con bcrypt (compatibile con hash legacy FOSUserBundle)
    password_hashers:
        App\Entity\User:
            algorithm: bcrypt
            cost: 13

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_scadenze_home
                username_parameter: _email
                password_parameter: _password
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800  # 7 giorni
                path: /

    access_control:
        # Login accessibile a tutti
        - { path: ^/login, roles: PUBLIC_ACCESS }
        # Tutto il resto richiede almeno ROLE_ADMIN
        - { path: ^/, roles: ROLE_ADMIN }

    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_ADMIN]

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
