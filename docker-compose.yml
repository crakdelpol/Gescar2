# ⚠️  SOLO SVILUPPO LOCALE — Non usare questo file in produzione.
# Le credenziali qui sotto sono di default per l'ambiente Docker locale.
# In produzione usare credenziali forti e uniche, mai le stesse di questo file.
# Non esporre mai le porte 3306 e 8080 su internet.

services:

  # ── MySQL 8.0 ────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: gescar_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gescar_new_local
      MYSQL_USER: gescar_user
      MYSQL_PASSWORD: gescar_pass
    ports:
      - "3306:3306"
    volumes:
      - gescar_db_data:/var/lib/mysql
      # Script SQL eseguiti automaticamente al primo avvio (opzionale)
      # - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── phpMyAdmin ───────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gescar_pma
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 128M        # Per importare dump SQL grandi
    ports:
      - "8080:80"

  # ── Mailpit (email locale per test, opzionale) ───────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: gescar_mail
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI web

volumes:
  gescar_db_data:
    driver: local
